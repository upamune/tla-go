name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MISE_AUTO_INSTALL: "false"
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go gofumpt go:golang.org/x/tools/cmd/goimports
      - run: mise run format:check
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go github:moznion/cccc github:Songmu/gosimilarity actionlint
      - run: mise run lint
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      - run: mise run test
  java-tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      - name: Download Java TLC 1.7.4
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  '"$RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: Download Java TLC 1.8.0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tla2tools-1.8.0.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo '011267fca25d0752cf18894dd585cd28b96960c112ea8a20b823ea770e7e10cd  '"$RUNNER_TEMP/tla2tools-1.8.0.jar" | sha256sum -c -
      - name: Compare with Java TLC
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools.jar
          TLC_MODERN_JAR: ${{ runner.temp }}/tla2tools-1.8.0.jar
        run: mise exec -- go test ./checker ./cmd/tla-go -run '^Test(Java(TLC|SANYRecursive)|PinnedJava)' -count=1 -timeout=60m
      - name: Fetch the pinned statechart corpus
        run: |
          set -eu
          git init "$RUNNER_TEMP/statechart-source"
          git -C "$RUNNER_TEMP/statechart-source" remote add origin https://github.com/cursor/plugins.git
          git -C "$RUNNER_TEMP/statechart-source" fetch --filter=blob:none --depth=1 origin 4dd1d05818d19792e7cd6e818f1667f95f7e1dbe
          git -C "$RUNNER_TEMP/statechart-source" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/statechart-source" sparse-checkout set pstack/skills/statechart
          git -C "$RUNNER_TEMP/statechart-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/statechart-source" rev-parse HEAD:pstack/skills/statechart)" = a79a48c6970be3b63d6efefb0a306b7c87de88d0
      - name: Compare statechart TLC results
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools.jar
          STATECHART_DIR: ${{ runner.temp }}/statechart-source/pstack/skills/statechart
        run: |
          mise install bun@1.3.11
          mise exec bun@1.3.11 -- go test ./cmd/tla-go -run '^(TestJavaTLCStatechart(Corpus|Marks|Hybrid|Standalone)|TestJavaSANY(MetadataLevels|RealTimeMetadata|InheritedNaturalsMetadata|StatechartMetadata|TLCLevels|TLCInstanceLevels|TheoremNewLevels|HigherOrderMetadata|HigherOrderInstances|HigherOrderLevelMatrix|HigherOrderLevelConstraints))$' -count=1 -timeout=15m
  pinact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: gitleaks
      - run: mise run secrets
  binaries:
    name: Binary smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      - name: Build and test standalone binary
        run: |
          set -eu
          binary=tla-go
          if [ "$RUNNER_OS" = Windows ]; then binary=tla-go.exe; fi
          CGO_ENABLED=0 mise exec -- go build -trimpath -o "$binary" ./cmd/tla-go
          "./$binary" -version
          set +e
          output=$("./$binary" examples/Counter.tla 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 11
          printf '%s\n' "$output" | grep -F 'Deadlock reached.'
      - name: Test checkpoint file replacement
        run: mise exec -- go test ./checker -run '^TestCheckpoint'
