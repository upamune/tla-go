name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_AUTO_INSTALL: "false"

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run security:dependencies
